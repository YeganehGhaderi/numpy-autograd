[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrad"
version = "0.1.0"
description = "A tensor-level reverse-mode autograd engine in pure NumPy, verified against PyTorch."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yeganeh Ghaderi" }]
dependencies = ["numpy>=1.22"]

[tool.setuptools]
packages = ["minigrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]